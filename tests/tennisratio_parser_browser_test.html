<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>TennisRatio Parser Browser Test</title></head>
<body>
<pre id="result">RUNNING</pre>
<script src="../source-utils.js"></script>
<script src="../tennisratio.js"></script>
<script>
const fixture = `
<section><h3>ATP Test Hard Test Final · 1 match</h3>
<div class="card">
  <span>02.08.</span><span>18:30</span><span>Final</span>
  <a href="/players/TaylorFritz.html">Taylor Fritz</a><span>Rank: 10</span>
  <strong>VS</strong>
  <a href="/players/RafaelJodar.html">Rafael Jodar</a><span>Rank: 24</span>
  <a href="/h2h-compare/taylor-fritz-vs-rafael-jodar.html">Match preview</a>
</div></section>`;
try {
  const parsed = TennisRatioDataSource.parseScheduleHtml(fixture, "ATP");
  if (parsed.length !== 1) throw new Error("expected one match");
  if (parsed[0].player_a !== "Taylor Fritz") throw new Error("player_a mismatch");
  if (parsed[0].surface !== "Hard") throw new Error("surface mismatch");
  document.getElementById("result").textContent = "PASS browser DOMParser schedule parser";
} catch (error) {
  document.getElementById("result").textContent = "FAIL " + error.stack;
}
</script>
</body>
